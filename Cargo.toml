[package]
name = "fsearch-crossplatform"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A cross-platform fork of fsearch, whole-disk/home file search for macOS and Linux"
repository = "https://github.com/threehymns/fsearch-crossplatform"
readme = "README.md"
keywords = ["search", "fuzzy", "filesystem", "cross-platform", "fast"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["demo", ".github", "rustfmt.toml", "packaging"]

[package.metadata.deb]
name = "fsearch-crossplatform"
maintainer = "threehymns <70611435+threehymns@users.noreply.github.com>"
copyright = "2026 threehymns, Noah Dunnagan"
license-file = ["LICENSE", "4"]
extended-description = """\
A cross-platform fork of fsearch, whole-disk/home file search for macOS and Linux. \
Finds any file by name in about a millisecond, forgives typos, and searches inside \
files with an index.\
"""
section = "utils"
priority = "optional"
assets = [
    ["target/release/fsearch", "usr/bin/fsearch", "755"],
    ["README.md", "usr/share/doc/fsearch-crossplatform/README.md", "644"],
]
conflicts = "fsearch"
provides = "fsearch"

[lib]
name = "fsearch"
path = "src/lib.rs"

[[bin]]
name = "fsearch"
path = "src/main.rs"

[dependencies]
libc = "0.2"
rayon = "1.12"
memchr = "2.8"
memmap2 = "0.9"
regex = "1.12"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# File watching on Linux (inotify). macOS uses FSEvents and needs no extra dep.
notify = "8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Release plus symbols, for profilers: cargo build --profile profiling
[profile.profiling]
inherits = "release"
debug = 1
strip = false
