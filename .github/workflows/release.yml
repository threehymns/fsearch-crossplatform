name: release
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate builds & packaging, skip publishing)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build-binaries:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: fsearch-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: fsearch-aarch64-apple-darwin
            # Portable baseline, not the runner's CPU (.cargo/config.toml
            # says native): the artifact must run on every Apple Silicon
            # Mac, as upstream's release does.
            rustflags: -C target-cpu=apple-m1
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: fsearch-x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build binary
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package archive
        shell: bash
        run: |
          staging="${{ matrix.artifact }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/fsearch" "$staging/"
          cp README.md LICENSE "$staging/"
          tar -czf "${staging}.tar.gz" -C "$staging" .
      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

      - name: Install cargo-deb
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@cargo-deb
      - name: Build Debian package (.deb)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo deb --no-build --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/debian/*.deb .
      - name: Upload deb artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fsearch-deb
          path: "*.deb"

  github-release:
    needs: [test, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            *
      - name: Dry Run Summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: dist
        run: |
          echo "=== DRY RUN SUCCESSFUL ==="
          echo "Verified release artifacts:"
          ls -lh
          echo ""
          echo "SHA256 checksums:"
          cat SHA256SUMS.txt

  publish-crates-io:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io (Dry Run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: cargo publish --dry-run
      - name: Publish to crates.io
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: cargo publish --token ${{ secrets.CRATES_IO_TOKEN }}
